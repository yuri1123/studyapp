<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>회계·세법·국어·영어 학습앱</title>
<style>
:root{--navy:#17324d;--blue:#246bce;--green:#27835c;--red:#c94c4c;--bg:#f3f6f9;--text:#1f2937;--muted:#64748b;--line:#d8e0e8;--white:#fff;--soft:#eaf2fd}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"SamsungOne","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}button{touch-action:manipulation}.top{background:#fff;padding:14px 16px;border-bottom:1px solid #e7edf2;position:sticky;top:0;z-index:5;padding-top:max(14px,env(safe-area-inset-top))}
.brand h1{margin:0;color:var(--navy);font-size:21px}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.45}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.btn{min-height:44px;border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 14px;border-radius:11px;cursor:pointer;font-weight:650}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.good{background:var(--green);border-color:var(--green);color:#fff}.btn.bad{background:var(--red);border-color:var(--red);color:#fff}.btn.active{background:var(--navy);border-color:var(--navy);color:#fff}
.shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;padding:14px;max-width:1400px;margin:0 auto;padding-bottom:calc(82px + env(safe-area-inset-bottom))}.side{background:#fff;border:1px solid #e4eaf0;border-radius:14px;padding:16px;height:fit-content;position:sticky;top:128px}.side h2{font-size:15px;color:var(--navy);margin:0 0 12px}.field{margin:0 0 11px}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 5px}.field select,.field input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff}.mode{display:grid;grid-template-columns:1fr 1fr;gap:7px}.checks{font-size:13px;margin:11px 0}.checks input{width:18px;height:18px;vertical-align:middle}.sep{height:1px;background:#e8edf2;margin:14px 0}.stats,.fileline,.tips{font-size:12px;line-height:1.6;color:var(--muted)}.stats{color:var(--text)}.smallbtns{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.main{min-width:0}.meta{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;color:var(--muted);font-size:12px;padding:2px 2px 8px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;min-height:480px;padding:28px;box-shadow:0 3px 16px rgba(15,23,42,.04)}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--blue);font-size:12px;font-weight:800}.prompt{font-size:23px;font-weight:800;line-height:1.55;margin:25px 0;white-space:pre-wrap;word-break:keep-all}.options{display:grid;gap:10px}.option{display:flex;gap:8px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:14px;min-height:54px;cursor:pointer}.letter{min-width:26px;color:var(--blue);font-weight:900}.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.ox button{font-size:28px;min-height:74px}.answer{margin-top:22px;display:grid;gap:10px}.result{font-size:18px;font-weight:900}.solution{font-size:17px;font-weight:900;color:var(--navy);white-space:pre-wrap}.note{background:#f7fafc;border:1px solid #e5ebf0;border-radius:10px;padding:13px 14px;line-height:1.65;white-space:pre-wrap}.selfgrade{display:grid;grid-template-columns:1fr 1fr;gap:8px}.empty{text-align:center;padding:110px 20px;color:var(--muted)}.empty strong{display:block;color:var(--navy);font-size:20px;margin-bottom:8px}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(900px,100%);display:grid;grid-template-columns:110px 1fr 110px;gap:8px;align-items:center;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid #e5eaf0;padding:9px 12px;padding-bottom:max(9px,env(safe-area-inset-bottom));z-index:6}.session{text-align:center;color:var(--muted);font-size:12px}.status{font-size:12px;color:#fff;background:var(--navy);padding:9px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hidden{display:none!important}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;max-width:calc(100% - 30px);background:#111827;color:#fff;padding:12px 14px;border-radius:10px;display:none;z-index:10;text-align:center}
.mobile-note{display:none;background:#eef6ff;border:1px solid #cfe3ff;color:#234;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.55;margin-top:10px}
@media(max-width:900px){.top{position:static}.shell{grid-template-columns:1fr;padding:10px}.side{position:static;padding:13px}.grid-mobile{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin:0}.card{min-height:410px;padding:20px 16px}.prompt{font-size:20px;margin:20px 0}.tips{display:none}.mobile-note{display:block}.nav{grid-template-columns:92px 1fr 92px}}
@media(min-width:901px) and (max-width:1150px){.shell{grid-template-columns:240px 1fr}}
@media(orientation:landscape) and (max-height:650px){.card{min-height:330px}.prompt{margin:16px 0}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>회계 · 세법 · 국어 · 영어 학습앱</h1><p>폴드/안드로이드용 · 엑셀 파일을 휴대폰에서 바로 불러와 학습합니다.</p></div>
  <div class="actions">
    <input id="fileInput" type="file" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" class="hidden">
    <button class="btn primary" id="uploadBtn">엑셀 불러오기</button>
    <button class="btn" id="templateBtn">엑셀 양식 저장</button>
  </div>
  <div class="mobile-note">휴대폰의 <b>내 파일</b>에서 엑셀을 선택하면 됩니다. 학습 내용과 진도는 이 기기 안에서만 처리됩니다.</div>
</header>
<div class="status" id="status">샘플 학습 내용을 준비했습니다. 엑셀을 불러오면 자동으로 교체됩니다.</div>
<div class="shell">
  <aside class="side">
    <h2>학습 필터</h2>
    <div class="grid-mobile">
      <div class="field"><label>과목</label><select id="subject"></select></div>
      <div class="field"><label>학습 유형</label><select id="kind"></select></div>
      <div class="field"><label>단원</label><select id="unit"></select></div>
      <div class="field"><label>검색</label><input id="search" type="text" placeholder="문제·답·태그 검색"></div>
    </div>
    <div style="margin-top:11px;font-size:12px;font-weight:800">학습 모드</div>
    <div class="mode" style="margin-top:6px"><button class="btn active" data-mode="quiz">퀴즈</button><button class="btn" data-mode="card">카드</button></div>
    <div class="checks"><label><input id="wrongOnly" type="checkbox"> 오답/헷갈림만 보기</label></div>
    <div class="sep"></div>
    <div class="stats" id="stats">문항 0개</div>
    <div class="fileline" id="filename"></div>
    <div class="sep"></div>
    <div class="smallbtns"><button class="btn" id="shuffleBtn">순서 섞기</button><button class="btn" id="resetBtn">진도 초기화</button></div>
  </aside>
  <main class="main">
    <div class="meta"><span id="meta">데이터 없음</span><strong id="counter">0 / 0</strong></div>
    <section class="card" id="card"></section>
  </main>
</div>
<div class="nav"><button class="btn" id="prevBtn">← 이전</button><div class="session" id="session">세션 정답률 -</div><button class="btn" id="nextBtn">다음 →</button></div>
<div class="toast" id="toast"></div>

function fillSelect(el,vals){const before=el.value||'전체';el.innerHTML=['전체',...vals.filter(v=>v!=='전체')].map(v=>`<option>${esc(v)}</option>`).join('');el.value=[...el.options].some(o=>o.value===before)?before:'전체'}
function refreshFilters(){fillSelect($('subject'),unique(S.items.map(x=>x.subject)));fillSelect($('kind'),unique(S.items.map(x=>x.kind)));updateUnits()}
function updateUnits(){const sub=$('subject').value||'전체',kind=$('kind').value||'전체';fillSelect($('unit'),unique(S.items.filter(x=>(sub==='전체'||x.subject===sub)&&(kind==='전체'||x.kind===kind)).map(x=>x.unit)))}

function setItems(items,filename){S.items=items||[];S.filename=filename||'';S.current=0;S.sessionTotal=0;S.sessionCorrect=0;refreshFilters();applyFilters(true);$('filename').textContent=filename?`현재 파일: ${filename}`:'';setStatus(`${filename||'샘플 데이터'} · ${S.items.length}개 학습 항목`) }
function render(){S.revealed=false;const n=S.filtered.length;$('counter').textContent=`${n?S.current+1:0} / ${n}`;if(!n){$('meta').textContent='데이터 없음';$('card').innerHTML='<div class="empty"><strong>표시할 학습 내용이 없습니다.</strong>엑셀을 불러오거나 필터를 변경해 주세요.</div>';updateStats();return}const it=S.filtered[S.current];$('meta').textContent=`${it.subject} · ${it.kind} · ${it.unit||'단원 미지정'}${it.tags?' · #'+it.tags:''}`;let html=`<span class="badge">${esc(it.kind)}</span><div class="prompt">${esc(promptOf(it)||'(내용 없음)')}</div>`;if(S.mode==='card'){html+=`<button class="btn primary" id="revealBtn">정답 / 뒷면 보기</button><div class="answer" id="answer"></div>`}else if(it.kind==='OX'){html+=`<div class="ox"><button class="btn good" data-ox="O">O</button><button class="btn bad" data-ox="X">X</button></div><div class="answer" id="answer"></div>`}else if(it.options?.length){html+='<div class="options">'+it.options.slice(0,4).map((o,idx)=>`<button class="option" data-letter="${String.fromCharCode(65+idx)}" data-opt="${esc(o)}"><span class="letter">${String.fromCharCode(65+idx)}.</span><span>${esc(o)}</span></button>`).join('')+'</div><div class="answer" id="answer"></div>'}else{html+=`<button class="btn primary" id="revealBtn">정답 보기</button><div class="answer" id="answer"></div>`}$('card').innerHTML=html;document.querySelectorAll('[data-ox]').forEach(b=>b.onclick=()=>grade(b.dataset.ox,''));document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>grade(b.dataset.letter,b.dataset.opt));if($('revealBtn'))$('revealBtn').onclick=reveal;updateStats()}
function answerHTML(it,result='',color=''){let h='';if(result)h+=`<div class="result" style="color:${color}">${esc(result)}</div>`;h+=`<div class="solution">정답: ${esc(solutionOf(it)||'(정답 없음)')}</div>`;if(it.example)h+=`<div class="note"><strong>예문</strong><br>${esc(it.example)}</div>`;if(it.explanation)h+=`<div class="note"><strong>해설</strong><br>${esc(it.explanation)}</div>`;return h}
function reveal(){if(!S.filtered.length||S.revealed)return;S.revealed=true;const it=S.filtered[S.current];$('answer').innerHTML=answerHTML(it);if(S.mode==='quiz'&&it.kind!=='OX'&&!(it.options?.length)){$('answer').insertAdjacentHTML('beforeend','<div class="selfgrade"><button class="btn good" id="knew">알았음</button><button class="btn bad" id="confused">헷갈림</button></div>');$('knew').onclick=()=>selfGrade(true);$('confused').onclick=()=>selfGrade(false)}}
function record(it,ok){S.sessionTotal++;if(ok)S.sessionCorrect++;const p=S.progress[it.uid]||(S.progress[it.uid]={seen:0,correct:0,wrong:0});p.seen=(p.seen||0)+1;if(ok)p.correct=(p.correct||0)+1;else p.wrong=(p.wrong||0)+1;saveProgress()}

function selfGrade(ok){if(!S.filtered.length)return;const it=S.filtered[S.current];record(it,ok);$('answer').innerHTML=answerHTML(it,ok?'기억 완료':'복습 대상으로 표시했습니다.',ok?'#27835c':'#c94c4c');updateStats()}
function updateStats(){const seen=S.filtered.filter(x=>(S.progress[x.uid]?.seen||0)>0).length,wrong=S.filtered.filter(x=>(S.progress[x.uid]?.wrong||0)>0).length;$('stats').innerHTML=`현재 필터: <strong>${S.filtered.length}개</strong><br>학습한 항목: ${seen}개<br>오답/헷갈림: ${wrong}개`;$('session').textContent=S.sessionTotal?`세션 정답률 ${Math.round(S.sessionCorrect/S.sessionTotal*100)}% (${S.sessionCorrect}/${S.sessionTotal})`:'세션 정답률 -'}
function next(){if(!S.filtered.length)return;S.current=(S.current+1)%S.filtered.length;render()}function prev(){if(!S.filtered.length)return;S.current=(S.current-1+S.filtered.length)%S.filtered.length;render()}

const aliases={'과목':['과목','subject','분야'],'유형':['유형','type','형식','문제유형'],'단원':['단원','unit','chapter','챕터'],'문제':['문제','question','질문','문항'],'정답':['정답','answer','답'],'보기1':['보기1','option1','선택지1','a'],'보기2':['보기2','option2','선택지2','b'],'보기3':['보기3','option3','선택지3','c'],'보기4':['보기4','option4','선택지4','d'],'해설':['해설','explanation','설명','풀이'],'앞면':['앞면','front','단어','개념명'],'뒷면':['뒷면','back','뜻','의미','개념설명'],'예문':['예문','example','문장'],'태그':['태그','tag','tags','키워드']};
const aliasMap={};Object.entries(aliases).forEach(([canon,arr])=>arr.forEach(a=>aliasMap[norm(a)]=canon));
function rowsToItems(sheets){const items=[];for(const sh of sheets){let headerIdx=-1,mapping={};for(let i=0;i<Math.min(10,sh.rows.length);i++){const cand={};(sh.rows[i]||[]).forEach((h,j)=>{const c=aliasMap[norm(h)];if(c)cand[c]=j});if(cand['유형']!==undefined&&(cand['문제']!==undefined||cand['앞면']!==undefined)){headerIdx=i;mapping=cand;break}}if(headerIdx<0)continue;const inferred=['회계','세법','국어','영어'].includes(sh.name)?sh.name:'';for(let r=headerIdx+1;r<sh.rows.length;r++){const row=sh.rows[r]||[],get=k=>{const idx=mapping[k];return idx===undefined?'':String(row[idx]??'').trim()};let subject=get('과목')||inferred||'기타',kind=kindNormalize(get('유형')),q=get('문제'),ans=get('정답'),front=get('앞면'),back=get('뒷면');const options=[1,2,3,4].map(i=>get('보기'+i)).filter(Boolean);if(kind==='OX')ans=oxNormalize(ans);if(!q&&!front&&!ans&&!back)continue;if((kind==='단어'||kind==='개념')&&!front)front=q;if((kind==='단어'||kind==='개념')&&!back)back=ans;if(kind!=='단어'&&kind!=='개념'&&!q)q=front;if(kind!=='단어'&&kind!=='개념'&&!ans)ans=back;const uid=[subject,kind,get('단원'),q,ans,front,back,sh.name,r].join('|');items.push({subject,kind,unit:get('단원'),question:q,answer:ans,options,explanation:get('해설'),front,back,example:get('예문'),tags:get('태그'),sheet:sh.name,uid:simpleHash(uid)})}}return items}
function simpleHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')}

function colIndex(ref){const m=String(ref||'').match(/[A-Z]+/i);if(!m)return 0;let n=0;for(const ch of m[0].toUpperCase())n=n*26+(ch.charCodeAt(0)-64);return n-1}
function resolvePath(base,target){if(target.startsWith('/'))return target.slice(1);const parts=base.split('/');parts.pop();for(const p of target.split('/')){if(p==='..')parts.pop();else if(p!=='.'&&p)parts.push(p)}return parts.join('/')}
function xmlText(node){return node?[...node.querySelectorAll('t')].map(x=>x.textContent||'').join(''):''}
async function unzipXlsx(buffer){const u8=new Uint8Array(buffer),dv=new DataView(buffer);let eocd=-1;for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}if(eocd<0)throw new Error('올바른 XLSX 파일이 아닙니다.');const total=dv.getUint16(eocd+10,true),cdOffset=dv.getUint32(eocd+16,true);let p=cdOffset;const files={};for(let e=0;e<total;e++){if(dv.getUint32(p,true)!==0x02014b50)throw new Error('XLSX 압축 구조를 읽지 못했습니다.');const method=dv.getUint16(p+10,true),compSize=dv.getUint32(p+20,true),nameLen=dv.getUint16(p+28,true),extraLen=dv.getUint16(p+30,true),commentLen=dv.getUint16(p+32,true),localOff=dv.getUint32(p+42,true);const name=new TextDecoder('utf-8').decode(u8.slice(p+46,p+46+nameLen));const lName=dv.getUint16(localOff+26,true),lExtra=dv.getUint16(localOff+28,true),start=localOff+30+lName+lExtra,comp=u8.slice(start,start+compSize);let data;if(method===0)data=comp;else if(method===8){if(typeof DecompressionStream==='undefined')throw new Error('이 브라우저가 XLSX 압축 해제를 지원하지 않습니다. 최신 삼성 인터넷 또는 Chrome을 사용해 주세요.');const ds=new DecompressionStream('deflate-raw');data=new Uint8Array(await new Response(new Blob([comp]).stream().pipeThrough(ds)).arrayBuffer())}else throw new Error('지원하지 않는 XLSX 압축 방식입니다.');files[name]=data;p+=46+nameLen+extraLen+commentLen}return files}
async function parseXlsx(buffer){const files=await unzipXlsx(buffer),dec=new TextDecoder('utf-8'),parse=bytes=>new DOMParser().parseFromString(dec.decode(bytes),'application/xml');if(!files['xl/workbook.xml'])throw new Error('통합문서 정보를 찾지 못했습니다.');const wb=parse(files['xl/workbook.xml']),rels=files['xl/_rels/workbook.xml.rels']?parse(files['xl/_rels/workbook.xml.rels']):null,relMap={};if(rels)[...rels.querySelectorAll('Relationship')].forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target'));let shared=[];if(files['xl/sharedStrings.xml']){const s=parse(files['xl/sharedStrings.xml']);shared=[...s.querySelectorAll('si')].map(xmlText)}const sheets=[];for(const s of [...wb.querySelectorAll('sheet')]){const name=s.getAttribute('name')||'Sheet',rid=s.getAttribute('r:id')||s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'),target=relMap[rid];if(!target)continue;const path=resolvePath('xl/workbook.xml',target);if(!files[path])continue;const doc=parse(files[path]),rows=[];for(const rowNode of [...doc.querySelectorAll('sheetData > row')]){const row=[];for(const c of [...rowNode.querySelectorAll(':scope > c')]){const idx=colIndex(c.getAttribute('r')),t=c.getAttribute('t')||'',v=c.querySelector(':scope > v')?.textContent??'',inline=c.querySelector(':scope > is');let val='';if(t==='s')val=shared[Number(v)]??'';else if(t==='inlineStr')val=xmlText(inline);else if(t==='b')val=v==='1'?'TRUE':'FALSE';else val=v;row[idx]=val}rows.push(row)}sheets.push({name,rows})}return rowsToItems(sheets)}

async function uploadFile(file){if(!file)return;setStatus('파일을 읽는 중입니다...');try{let items;if(/\.csv$/i.test(file.name))items=parseCsv(await file.text(),file.name);else items=await parseXlsx(await file.arrayBuffer());if(!items.length)throw new Error('학습 데이터 행을 찾지 못했습니다. 양식의 학습데이터 시트를 확인해 주세요.');setItems(items,file.name);toast(`${items.length}개 항목을 불러왔습니다.`)}catch(e){console.error(e);setStatus('불러오기 실패: '+e.message);alert('파일을 읽지 못했습니다.\n\n'+e.message)}finally{$('fileInput').value=''}}

$('uploadBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>uploadFile(e.target.files[0]);$('templateBtn').onclick=saveTemplate;$('nextBtn').onclick=next;$('prevBtn').onclick=prev;
$('shuffleBtn').onclick=()=>{for(let i=S.filtered.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[S.filtered[i],S.filtered[j]]=[S.filtered[j],S.filtered[i]]}S.current=0;render();toast('학습 순서를 섞었습니다.')};
$('resetBtn').onclick=()=>{if(confirm('저장된 정답/오답 기록을 모두 초기화할까요?')){S.progress={};saveProgress();S.sessionTotal=S.sessionCorrect=0;applyFilters(false);setStatus('학습 진도를 초기화했습니다.')}};
$('subject').onchange=()=>applyFilters();$('kind').onchange=()=>applyFilters();$('unit').onchange=()=>applyFilters();$('search').oninput=()=>applyFilters(false);$('wrongOnly').onchange=()=>applyFilters();
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));render()});
