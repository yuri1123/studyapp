<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>세무직 9급 합격 메이트</title>
<!-- v25: consistent card-back fonts and export current data workbook -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e3e8f0;
  --blue:#2563eb;--blueSoft:#eaf2ff;--green:#16803a;--greenSoft:#eaf8ef;
  --red:#c62828;--redSoft:#fff0f0;--amber:#9a5c00;--amberSoft:#fff7e6;
  --shadow:0 8px 24px rgba(25,42,89,.08);
  --navH:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
body{overflow:hidden}

.app{
  width:min(760px,100%);
  height:100dvh;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.topbar{
  position:relative;
  z-index:30;
  flex:0 0 auto;
  background:rgba(244,247,251,.97);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(227,232,240,.9);
  padding:max(8px,env(safe-area-inset-top)) 10px 7px;
}
.titleRow{display:flex;align-items:center;justify-content:space-between;gap:7px}
.brand{font-size:16px;font-weight:950;line-height:1.13;letter-spacing:-.035em;min-width:0}
.brand small{display:block;font-size:8.5px;line-height:1.2;color:var(--muted);font-weight:750;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selectorToggle{
  flex:0 0 auto;height:32px;padding:0 9px;border:1px solid #d9e2ee;background:#fff;color:#28405f;
  border-radius:11px;font-size:10.5px;font-weight:950;box-shadow:0 3px 10px rgba(25,42,89,.05)
}
.selectorPanel{
  position:absolute;left:8px;right:8px;top:calc(100% - 1px);z-index:50;
  background:rgba(255,255,255,.99);border:1px solid var(--line);border-radius:0 0 18px 18px;
  padding:10px;box-shadow:0 16px 35px rgba(25,42,89,.16);
  transform-origin:top;transition:.18s ease;
}
.selectorPanel.collapsed{opacity:0;transform:translateY(-5px) scaleY(.98);pointer-events:none}
.selectorLabel{font-size:9px;font-weight:950;color:#8792a3;margin:5px 2px 4px}
.subjectTabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.subjectTab{height:35px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:11px;font-weight:900;color:#46556b}
.subjectTab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.sectionTabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.sectionTabs::-webkit-scrollbar{display:none}
.sectionTab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:10.5px;font-weight:900;color:#566074}
.sectionTab.active{background:#172033;color:#fff;border-color:#172033}
.utilityActions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:7px}
.miniBtn{height:34px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:10px;font-weight:900;color:#39445a}
.scopeHint{font-size:9px;color:#8a94a6;text-align:center;margin-top:5px}

.content{
  flex:1 1 auto;min-height:0;overflow:hidden;padding:6px 6px calc(var(--navH) + env(safe-area-inset-bottom));
}
.screen{display:none;height:100%;min-height:0}
.screen.active{display:block}

/* HOME */
.homeScroll,.reviewScroll,.quizScroll{height:100%;overflow:auto;padding-bottom:8px}
.hero{padding:18px 16px;border-radius:24px;background:linear-gradient(135deg,#3478f6,#1e40af);color:#fff;box-shadow:0 10px 24px rgba(37,99,235,.22)}
.hero h1{margin:0;font-size:25px;line-height:1.15;letter-spacing:-.04em}
.hero p{margin:7px 0 0;font-size:12px;line-height:1.5;color:rgba(255,255,255,.9)}
.quickGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.quickCard{border:0;background:#fff;border-radius:17px;padding:12px;text-align:left;min-height:78px;box-shadow:var(--shadow)}
.quickCard strong{display:block;font-size:14px}
.quickCard span{display:block;font-size:10px;color:var(--muted);margin-top:5px;line-height:1.35}
.panel{background:#fff;border-radius:20px;padding:14px;margin-top:10px;box-shadow:var(--shadow)}
.sectionTitle{font-size:16px;font-weight:950}.sectionSub{font-size:10.5px;color:var(--muted);margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.stat{padding:10px 5px;border-radius:14px;background:#f8fafc;border:1px solid var(--line);text-align:center}
.stat strong{display:block;font-size:17px}.stat span{display:block;font-size:9.5px;color:var(--muted);margin-top:2px}

/* COMMON */
.headRow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px}
.badge,.subBadge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:10.5px;font-weight:900}
.badge{background:var(--blueSoft);color:var(--blue)}
.subBadge{background:#f6f0ff;color:#7047a5}
.progress{font-size:10.5px;color:var(--muted);font-weight:900}
.actions{display:flex;gap:6px}
.btn{border:1px solid var(--line);border-radius:12px;padding:8px 9px;min-height:34px;background:#fff;color:#39445a;font-weight:900;font-size:11.5px;flex:1}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:disabled{opacity:.45}
.empty{padding:30px 14px;text-align:center;color:var(--muted);font-size:12px}.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:6px}

/* CARD — compact by design */
.cardShell{
  height:100%;min-height:0;
  display:grid;
  grid-template-rows:26px minmax(0,1fr) 34px 34px;
  gap:6px;
}
.flipWrap{min-height:0;perspective:1400px}
.flipCard{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}
.flipCard.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;
  background:linear-gradient(180deg,#f8fbff 0%,#eef4fa 100%);
  border:1px solid #d8e4ef;border-radius:24px;box-shadow:var(--shadow);
  padding:12px 14px;overflow:hidden;
}
.face.back{transform:rotateY(180deg);overflow-y:auto;padding-bottom:16px}
.unitTag{
  display:none !important;
}
.front{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding-top:20px;
  padding-bottom:42px;
}
.frontText{
  font-size:31px;line-height:1.04;font-weight:950;letter-spacing:-.04em;
  color:#1f5fd3;text-align:center;margin:0
}
.wordPron{
  font-size:11.5px;line-height:1.15;color:#6b7a90;font-weight:800;text-align:center;
  margin-top:6px;min-height:0
}
.frontMeaning{
  margin-top:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  width:100%;
}
.meaningRow{
  display:grid;
  grid-template-columns:30px auto;
  gap:7px;
  align-items:center;
  justify-content:center;
  width:auto;
  margin:0 auto;
  padding:0;
  border-top:0;
  color:#26364b;
  font-size:12.5px;
  line-height:1.2;
}
.meaningRow:first-child{border-top:0}
.posTag{
  justify-self:center;min-width:26px;text-align:center;padding:3px 5px;border-radius:999px;
  background:#dcecff;color:#1957bd;border:1px solid #c6dbf6;font-weight:950;font-size:9px
}
.flipTip{
  position:absolute;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  width:calc(100% - 24px);
  text-align:center;
  font-size:8.5px;
  color:#7a8798;
  font-weight:800
}
.backWordTitle{font-size:28px;font-weight:950;margin:2px 0 8px}
.backText{font-size:13px;color:#526176;background:#e7eef6;border:1px solid #d4e0ec;border-radius:12px;padding:8px 10px;margin-bottom:8px}
.detailGroup{padding:10px 0;border-top:1px solid #d8e4ef}
.detailGroup:first-child{border-top:0}
.detailTitle{display:flex;align-items:center;gap:6px;color:#66758a;font-weight:900;font-size:11px;margin-bottom:7px}
.detailIcon{display:inline-grid;place-items:center;width:22px;height:22px;border:1.5px solid #4a90e2;border-radius:7px;color:#2f75c8;background:#edf5ff;font-size:11px}
.detailItems{display:grid;gap:6px}
.detailItem{display:grid;grid-template-columns:minmax(72px,.8fr) minmax(120px,1.5fr);gap:8px;font-size:12.5px;line-height:1.4}
.detailItem .term{font-weight:900}.detailItem .desc{color:#46566b}
.detailPlain{font-size:12.5px;line-height:1.5;color:#34455b;white-space:pre-wrap}
.exampleBlock{border-left:3px solid #4a90e2;background:#f4f8fc;border-radius:0 10px 10px 0;padding:8px 9px 8px 11px}
.exampleEn{font-size:13px;line-height:1.45}.exampleKo{font-size:12px;color:#66758a;line-height:1.45;margin-top:5px}

.memoryBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.memoryBtn{border:1px solid var(--line);border-radius:12px;background:#fff;padding:7px 3px;min-height:34px;font-size:11.5px;font-weight:900}
.memoryBtn.know{color:#08732d;background:var(--greenSoft);border-color:#b4dfc1}
.memoryBtn.confused{color:#9a5c00;background:var(--amberSoft);border-color:#f3d29a}
.memoryBtn.unknown{color:#ac2020;background:var(--redSoft);border-color:#ffc6c6}
.memoryBtn.active{outline:2px solid rgba(37,99,235,.24)}

/* QUIZ */
.quizShell{min-height:100%;display:flex;flex-direction:column;gap:7px}
.quizCard{background:#fff;border:2px solid transparent;border-radius:22px;padding:14px;box-shadow:var(--shadow);flex:1;display:flex;flex-direction:column}
.metaRow{display:flex;flex-wrap:wrap;gap:5px}
.question{font-size:21px;font-weight:950;line-height:1.42;letter-spacing:-.03em;margin:14px 0;white-space:pre-wrap;word-break:keep-all}
.options{display:grid;gap:7px;margin-top:auto}.ox{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:auto}
.option{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;font-weight:850;color:var(--text);display:flex;gap:8px;align-items:flex-start;font-size:13px}
.option .letter{min-width:20px;color:var(--blue);font-weight:950}.ox .option{justify-content:center;align-items:center;font-size:25px;min-height:70px}
.option.correct{background:var(--greenSoft);border-color:#9bd8af;color:#08732d}.option.wrong{background:var(--redSoft);border-color:#ffb2b2;color:#ab2525}
.answerBox{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.answerBox.show{display:block}
.result{display:inline-block;border-radius:999px;padding:6px 9px;font-size:10.5px;font-weight:950}.result.correct{background:var(--greenSoft);color:#08732d}.result.wrong{background:var(--redSoft);color:#ac2020}
.explain{margin:7px 0 0;font-size:12px;color:#3d4658;line-height:1.55;white-space:pre-wrap}

/* REVIEW */
.reviewFilter{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}
.reviewChip{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 3px;font-size:10px;font-weight:900;color:#4b5563}.reviewChip.active{background:var(--blueSoft);color:var(--blue);border-color:#bdd3ff}
.reviewList{display:grid;gap:8px;margin-top:10px}
.reviewItem{border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px;text-align:left;box-shadow:0 4px 14px rgba(25,42,89,.05)}
.reviewItem strong{display:block;font-size:12.5px;line-height:1.45}.reviewItem span{display:block;font-size:9.5px;color:var(--muted);margin-top:4px}
.stateLabel{display:inline-block!important;width:max-content;padding:4px 7px;border-radius:999px;margin-top:6px!important;font-weight:900}
.stateLabel.wrong,.stateLabel.unknown{background:var(--redSoft);color:#ac2020}.stateLabel.confused{background:var(--amberSoft);color:#9a5c00}

/* NAV */
.bottomNav{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);
  width:min(760px,100%);z-index:60;
  background:rgba(255,255,255,.98);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:4px 8px calc(4px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  min-height:var(--navH)
}
.navBtn{border:0;background:transparent;border-radius:12px;padding:5px 4px 4px;color:#667085;font-size:9.5px;font-weight:850;display:flex;flex-direction:column;align-items:center;gap:1px}
.navBtn b{font-size:15px}.navBtn.active{background:var(--blueSoft);color:var(--blue)}
.toast{position:fixed;left:50%;bottom:calc(var(--navH) + 8px);transform:translateX(-50%);z-index:100;background:#111827;color:#fff;border-radius:999px;padding:9px 12px;font-size:10.5px;font-weight:850;display:none;max-width:calc(100% - 28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{display:block}

@media(min-width:481px){
  .brand{font-size:20px}.brand small{font-size:10px}
  .selectorToggle{height:38px;font-size:11px}
  .content{padding:10px 10px calc(68px + env(safe-area-inset-bottom))}
  .cardShell{grid-template-rows:30px minmax(0,1fr) 40px 40px;gap:8px}
  .frontText{font-size:36px}
  .meaningRow{font-size:14px;padding:0}
  .wordPron{font-size:13px}
  .memoryBtn,.btn{font-size:13px}
}

/* v13: 모든 카드 앞면 공통 중앙 정렬 */
.face.front{
  display:flex !important;
  flex-direction:column !important;
  align-items:center !important;
  justify-content:center !important;
  text-align:center !important;
}

.face.front .frontText,
.face.front .wordPron,
.face.front .frontMeaning,
.face.front .meaningRow{
  text-align:center !important;
}

.face.front .frontMeaning{
  width:100% !important;
  align-items:center !important;
  justify-content:center !important;
}

.face.front .meaningRow{
  justify-content:center !important;
  margin-left:auto !important;
  margin-right:auto !important;
}

.face.front .posTag{
  justify-self:center !important;
}


/* v14: 뒷면 안정화 + 카드 높이 고정 */
.face.back{
  display:block !important;
  overflow-y:auto !important;
  text-align:left !important;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.face.back .flipTip{
  display:none !important;
}

/* 카드 영역은 항상 '모르겠어요' 버튼 바로 위까지 채움 */
.cardShell{
  height:100% !important;
  min-height:0 !important;
}
.flipWrap,
.flipCard{
  height:100% !important;
  min-height:0 !important;
}


/* v15: 전체 글씨를 약 1px 정도 키움 */
@media(max-width:480px){
  .brand{font-size:17px !important}
  .brand small{font-size:9.5px !important}
  .selectorToggle{font-size:11.5px !important}
  .selectorLabel{font-size:10px !important}
  .subjectTab{font-size:12px !important}
  .sectionTab{font-size:11.5px !important}
  .miniBtn{font-size:11px !important}
  .scopeHint{font-size:10px !important}

  .hero h1{font-size:26px !important}
  .hero p{font-size:13px !important}
  .quickCard strong{font-size:15px !important}
  .quickCard span{font-size:11px !important}
  .sectionTitle{font-size:17px !important}
  .sectionSub{font-size:11.5px !important}
  .stat strong{font-size:18px !important}
  .stat span{font-size:10.5px !important}

  .badge,.subBadge{font-size:11.5px !important}
  .progress{font-size:11.5px !important}
  .btn{font-size:12.5px !important}

  .frontText{font-size:32px !important}
  .wordPron{font-size:12.5px !important}
  .meaningRow{font-size:13.5px !important}
  .posTag{font-size:10px !important}
  .flipTip{font-size:9.5px !important}

  .backWordTitle{font-size:29px !important}
  .backText{font-size:14px !important}
  .detailTitle{font-size:12px !important}
  .detailIcon{font-size:12px !important}
  .detailItem{font-size:13.5px !important}
  .detailPlain{font-size:13.5px !important}
  .exampleEn{font-size:14px !important}
  .exampleKo{font-size:13px !important}

  .memoryBtn{font-size:12.5px !important}

  .question{font-size:22px !important}
  .option{font-size:14px !important}
  .result{font-size:11.5px !important}
  .explain{font-size:13px !important}

  .reviewChip{font-size:11px !important}
  .reviewItem strong{font-size:13.5px !important}
  .reviewItem span{font-size:10.5px !important}

  .navBtn{font-size:10.5px !important}
}


/* v16: 과목 중심 헤더 + 퀴즈/카드 디자인 통일 */

/* 상단: '세무직 9급 합격 메이트' 대신 선택한 과목만 크게 */
.topbar{
  padding:max(8px,env(safe-area-inset-top)) 10px 7px !important;
}
.subjectTitle{
  font-size:24px;
  line-height:1;
  font-weight:950;
  letter-spacing:-.04em;
  color:var(--text);
}
.filterToggle{
  display:block;
  width:max-content;
  height:29px !important;
  min-height:29px !important;
  margin-top:6px;
  padding:0 9px !important;
  border-radius:10px !important;
  font-size:11px !important;
}
.selectorPanel{
  top:calc(100% - 1px) !important;
}

/* 카드: 남는 높이를 전부 사용하고 기억 버튼 바로 위에서 끝남 */
.cardShell{
  height:100% !important;
  min-height:0 !important;
  grid-template-rows:26px minmax(0,1fr) 34px 34px !important;
  gap:4px !important;
}
.flipWrap,
.flipCard{
  height:100% !important;
  min-height:0 !important;
}
.memoryBtns{
  margin:0 !important;
}

/* 퀴즈도 카드와 같은 뼈대/질감 */
.quizShell{
  height:100% !important;
  min-height:0 !important;
  display:grid !important;
  grid-template-rows:26px minmax(0,1fr) 34px !important;
  gap:4px !important;
}
.quizCard{
  min-height:0 !important;
  overflow-y:auto !important;
  background:linear-gradient(180deg,#f8fbff 0%,#eef4fa 100%) !important;
  border:1px solid #d8e4ef !important;
  border-radius:24px !important;
  box-shadow:var(--shadow) !important;
  padding:14px !important;
  display:flex !important;
  flex-direction:column !important;
}
.metaRow{
  display:none !important;
}

/* 퀴즈의 메인 문제 = 카드의 메인 단어와 같은 크기 */
.question{
  font-size:31px !important;
  line-height:1.15 !important;
  font-weight:950 !important;
  letter-spacing:-.04em !important;
  text-align:center !important;
  margin:10px auto 18px !important;
  width:100% !important;
  color:#1f5fd3 !important;
}

/* 선택지 디자인도 카드 버튼 느낌으로 정리 */
.options,
.ox{
  margin-top:auto !important;
  gap:6px !important;
}
.option{
  border-radius:12px !important;
  background:rgba(255,255,255,.92) !important;
  border:1px solid #d8e4ef !important;
  box-shadow:none !important;
}
.option.correct{
  background:var(--greenSoft) !important;
  border-color:#9bd8af !important;
}
.option.wrong{
  background:var(--redSoft) !important;
  border-color:#ffb2b2 !important;
}

@media(max-width:480px){
  .subjectTitle{font-size:25px !important}
  .filterToggle{font-size:11.5px !important}

  /* deduct와 동일한 32px */
  .question{font-size:32px !important}

  .quizCard{padding:12px 13px !important}
}

@media(min-width:481px){
  .subjectTitle{font-size:28px}
  .filterToggle{font-size:12px !important}
  .question{font-size:36px !important}
}


/* v17: 상단 토글 우측 배치 + 퀴즈 글씨 확대 + 카드 영역 위로 확장 */
.subjectHeaderRow{
  display:flex !important;
  align-items:center !important;
  justify-content:space-between !important;
  gap:10px !important;
  width:100% !important;
}
.subjectTitle{
  flex:1 1 auto !important;
  min-width:0 !important;
}
.filterToggle{

{subject:'회계',kind:'OX',subtitle:'기초개념',unit:'재무회계',question:'자산은 과거 사건의 결과로 기업이 통제하는 현재의 경제적 자원이다.',answer:'O',options:[],explanation:'자산의 기본 정의를 확인하는 문항입니다.'},

{subject:'영어',kind:'단어',subtitle:'Day 1',unit:'Vocabulary',front:'account',back:'계정 | 설명하다',partOfSpeech:'noun | verb',pronunciation:'/əˈkaʊnt/',synonyms:'record: 기록 | report: 보고',antonyms:'',derivatives:'accountable: 책임 있는 | accounting: 회계 | accountant: 회계사',phrases:'account for ~ : ~을 설명하다',example:'Please check your account balance.',exampleTranslation:'계좌 잔액을 확인해 주세요.',memo:'명사/동사 뜻을 함께 구분'},
{subject:'영어',kind:'단어',subtitle:'Day 1',unit:'Vocabulary',front:'deduct',back:'공제하다 | 빼다',partOfSpeech:'verb',pronunciation:'/dɪˈdʌkt/',synonyms:'subtract: 빼다 | remove: 제거하다',antonyms:'add: 더하다 | include: 포함하다',derivatives:'deduction: 공제 | deductible: 공제 가능한',phrases:'deduct A from B : B에서 A를 빼다',example:'The company will deduct the fee from your payment.',exampleTranslation:'회사는 지급액에서 수수료를 공제할 것입니다.',memo:'from과 함께 자주 사용'},

].map((x,i)=>({...x,uid:'sample_'+i}));

const norm=v=>String(v??'').trim();

  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1500)
}

    localStorage.setItem(STORAGE,JSON.stringify({
      items:S.items,wrong:[...S.wrong],memory:S.memory,attempts:S.attempts,filename:S.filename
    }))

}

function load(){
  try{
    let o=JSON.parse(localStorage.getItem(STORAGE)||'null');
    if(!o){
      for(const k of ['study_app_v24_compact','study_app_v23_compact','study_app_v22_compact','study_app_v21_compact','study_app_v20_compact','study_app_v19_compact','study_app_v18_compact','study_app_v17_compact','study_app_v16_compact','study_app_v15_compact','study_app_v14_compact','study_app_v13_compact','study_app_v12_compact','study_app_v11_compact','study_app_v10_compact']){
        const cand=JSON.parse(localStorage.getItem(k)||'null');
        if(cand){o=cand;break}
      }
    }
    if(o){
      if(Array.isArray(o.items)&&o.items.length)S.items=o.items;
      if(Array.isArray(o.wrong))S.wrong=new Set(o.wrong);
      if(o.memory)S.memory=o.memory;
      if(o.attempts)S.attempts=o.attempts;
      if(o.filename)S.filename=o.filename;
    }
  }catch(e){}
}

function refreshPools(){
  let q=S.items.filter(x=>x.subject===S.subject&&sectionMatch(x)&&isQuiz(x));
  if(S.quizMode==='ox')q=q.filter(x=>x.kind==='OX');
  if(S.quizMode==='mc')q=q.filter(x=>x.kind!=='OX');
  S.quizPool=q;
  S.cardPool=S.items.filter(x=>x.subject===S.subject&&sectionMatch(x)&&isCard(x));
  S.qIndex=Math.min(S.qIndex,Math.max(0,q.length-1));
  S.cIndex=Math.min(S.cIndex,Math.max(0,S.cardPool.length-1));
}

function splitPipe(v){return norm(v)?norm(v).split(/\s*\|\s*|\r?\n|\s*;\s*/).map(x=>x.trim()).filter(Boolean):[]}
function splitList(v){return norm(v)?norm(v).split(/\s*\|\s*|\r?\n|\s*;\s*|\s*,\s*/).map(x=>x.trim()).filter(Boolean):[]}
function splitLexicalList(v){
  return norm(v)
    ? norm(v).split(/\s*\|\s*|\r?\n|\s*;\s*/).map(x=>x.trim()).filter(Boolean)
    : [];
}
function shortPos(v){
  const x=norm(v).toLowerCase().replace(/\./g,'');
  if(/^(n|noun|명|명사)$/.test(x))return'명';
  if(/^(v|verb|동|동사)$/.test(x))return'동';
  if(/^(a|adj|adjective|형|형용사)$/.test(x))return'형';
  if(/^(ad|adv|adverb|부|부사)$/.test(x))return'부';
  if(/^(p|prep|preposition|전|전치사)$/.test(x))return'전';
  return norm(v)||'';
}
function fullPos(v){
  const raw=norm(v);
  if(!raw)return'';
  const x=raw.toLowerCase().replace(/\./g,'').trim();
  if(/^(n|noun|명|명사)$/.test(x))return'명사';
  if(/^(v|verb|동|동사)$/.test(x))return'동사';
  if(/^(a|adj|adjective|형|형용사)$/.test(x))return'형용사';
  if(/^(ad|adv|adverb|부|부사)$/.test(x))return'부사';
  if(/^(p|prep|preposition|전|전치사)$/.test(x))return'전치사';
  return raw;
}
function fullPosDisplay(v){
  const parts=String(v??'')
    .split(/\s*[|,/;]\s*|\r?\n/)
    .map(x=>x.trim())
    .filter(Boolean);
  return parts.map(fullPos).filter(Boolean).join(' / ');
}
function meaningRows(it){
  const raw=norm(it.back||it.answer),pos=splitPipe(it.partOfSpeech);
  const labeled=splitPipe(raw).map(x=>{const m=x.match(/^([^:：]{1,12})[:：]\s*(.+)$/);return m?{pos:shortPos(m[1]),meaning:m[2]}:null}).filter(Boolean);
  if(labeled.length)return labeled;
  const meanings=splitPipe(raw);
  if(meanings.length>1&&pos.length===meanings.length)return meanings.map((m,i)=>({pos:shortPos(pos[i]),meaning:m}));
  return raw?[{pos:shortPos(it.partOfSpeech),meaning:raw}]:[];
}
function parseTermDesc(text){
  const s=String(text??'').trim();
  const m=s.match(/^(.+?)\s*[:：]\s*(.+)$/);
  return m?[m[1].trim(),m[2].trim()]:[s,''];
}
function parseLexicalItem(text){
  const s=String(text??'').trim();

  // 지원 예:
  // protection n 보호
  // protection / n / 보호
  // protection:n:보호
  // protection (n): 보호
  let m=s.match(/^(.+?)\s*[\/|]\s*(n|v|a|ad|p)\s*[\/|]\s*(.+)$/i);
  if(m)return{term:m[1].trim(),pos:shortPos(m[2]),desc:m[3].trim()};

  m=s.match(/^(.+?)\s*\((n|v|a|ad|p)\)\s*[:：]?\s*(.+)$/i);
  if(m)return{term:m[1].trim(),pos:shortPos(m[2]),desc:m[3].trim()};

  m=s.match(/^([^:：]+?)\s*[:：]\s*(n|v|a|ad|p)\s*[:：]\s*(.+)$/i);
  if(m)return{term:m[1].trim(),pos:shortPos(m[2]),desc:m[3].trim()};

  m=s.match(/^(.+?)\s+(n|v|a|ad|p)\s+(.+)$/i);
  if(m)return{term:m[1].trim(),pos:shortPos(m[2]),desc:m[3].trim()};

  const [term,desc]=parseTermDesc(s);
  return{term,pos:'',desc};
}
function detailGroup(title,icon,value,comma=true,mode='normal'){
  const arr=mode==='lexical'
    ? splitLexicalList(value)
    : (comma?splitList(value):splitPipe(value));
  if(!arr.length)return'';

  if(mode==='lexical'){
    const items=arr.map(x=>{
      const it=parseLexicalItem(x);
      return `<div class="lexicalItem">
        <span class="term">${esc(it.term)}</span>
        ${it.pos?`<span class="lexPos">${esc(it.pos)}</span>`:''}
        ${it.desc?`<span class="lexicalDesc">${esc(it.desc)}</span>`:''}
      </div>`;
    }).join('');
    return `<div class="detailGroup derivativeGroup"><div class="detailTitle"><span class="detailIcon">${icon}</span>${esc(title)}</div><div class="lexicalList">${items}</div></div>`;
  }

  const items=arr.map(x=>{
    const[a,b]=parseTermDesc(x);
    return `<div class="detailItem"><span class="term">${esc(a)}</span><span class="desc">${esc(b)}</span></div>`;
  }).join('');
  return `<div class="detailGroup"><div class="detailTitle"><span class="detailIcon">${icon}</span>${esc(title)}</div><div class="detailItems">${items}</div></div>`;
}

  let detail='';

  detail+=detailGroup('숙어 / 표현','•',it.phrases,false);
  detail+=detailGroup('핵심표현','★',it.keyExpressions,false);
  if(norm(it.etymology))detail+=`<div class="detailGroup"><div class="detailTitle"><span class="detailIcon">↳</span>어원</div><div class="detailPlain">${esc(it.etymology)}</div></div>`;
  if(norm(it.example)||norm(it.exampleTranslation))detail+=`<div class="detailGroup"><div class="detailTitle"><span class="detailIcon">··</span>기출예문</div><div class="exampleBlock"><div class="exampleEn">${esc(it.example)}</div>${norm(it.exampleTranslation)?`<div class="exampleKo">${esc(it.exampleTranslation)}</div>`:''}</div></div>`;
  if(norm(it.memo))detail+=`<div class="detailGroup"><div class="detailTitle"><span class="detailIcon">i</span>메모</div><div class="detailPlain">${esc(it.memo)}</div></div>`;
  if(!detail&&norm(it.back))detail=`<div class="detailGroup"><div class="detailPlain">${esc(it.back)}</div></div>`;
  $('wordMeta').innerHTML=detail;

  $$('[data-memory]').forEach(b=>b.classList.toggle('active',b.dataset.memory===state));

}

function quizAnswerNumber(v){
  const x=norm(v).toUpperCase();
  const map={A:'1',B:'2',C:'3',D:'4',E:'5'};
  if(map[x])return map[x];
  const m=x.match(/[1-5]/);
  return m?m[0]:x;
}

function grade(it,choice,clicked){
  if(S.answered)return;
  S.answered=true;

  const isOx=norm(it.kind).toUpperCase()==='OX';
  const answer=isOx?norm(it.answer).toUpperCase():quizAnswerNumber(it.answer);
  const picked=isOx?norm(choice).toUpperCase():quizAnswerNumber(choice);
  const ok=picked===answer,id=itemId(it);

  const a=S.attempts[id]||(S.attempts[id]={correct:0,total:0});
  a.total++;
  if(ok)a.correct++;
  if(ok)S.wrong.delete(id);else S.wrong.add(id);

  [...$('optionsArea').children].forEach(b=>{
    const val=isOx?norm(b.dataset.value).toUpperCase():quizAnswerNumber(b.dataset.value);
    if(val===answer)b.classList.add('correct');
    if(b===clicked&&!ok)b.classList.add('wrong');
  });

  $('resultPill').textContent=ok?'정답이에요!':`오답이에요 · 정답 ${answer}`;
  $('resultPill').className='result '+(ok?'correct':'wrong');
  $('answerBox').classList.add('show');
  save();renderHome();renderReview();
  toast(ok?'정답!':'복습함에 저장했어요');
}

function renderReview(){
  const area=$('reviewList');
  $$('[data-review]').forEach(b=>b.classList.toggle('active',b.dataset.review===S.reviewFilter));
  let list=[];
  S.items.filter(x=>x.subject===S.subject&&sectionMatch(x)).forEach(it=>{
    const id=itemId(it),mem=S.memory[id];
    if(S.wrong.has(id))list.push({it,type:'wrong'});
    if(mem==='confused')list.push({it,type:'confused'});
    if(mem==='unknown')list.push({it,type:'unknown'});
  });
  if(S.reviewFilter!=='all')list=list.filter(x=>x.type===S.reviewFilter);
  if(!list.length){area.innerHTML='<div class="empty"><strong>복습할 항목이 없어요</strong>틀린 문제나 헷갈리는 단어가 생기면 여기에 모입니다.</div>';return}
  area.innerHTML='';
  list.forEach(({it,type})=>{
    const b=document.createElement('button');b.className='reviewItem';
    const label=type==='wrong'?'문제 오답':type==='confused'?'헷갈리는 단어':'모르는 단어';
    b.innerHTML=`<strong>${esc(it.question||it.front||'(항목)')}</strong><span>${esc(sectionOf(it))} · ${esc(it.unit||'')} · ${esc(it.kind)}</span><span class="stateLabel ${type}">${label}</span>`;
    b.onclick=()=>{
      S.section=sectionOf(it);refreshPools();
      if(isCard(it)){S.cIndex=Math.max(0,S.cardPool.findIndex(x=>itemId(x)===itemId(it)));setScreen('card')}
      else{S.quizMode='all';refreshPools();S.qIndex=Math.max(0,S.quizPool.findIndex(x=>itemId(x)===itemId(it)));setScreen('quiz')}
    };
    area.appendChild(b);
  })
}

function resetCurrentScope(){
  const items=currentScopeItems(),ids=new Set(items.map(itemId));
  const label=S.section==='전체'?`${S.subject} 전체`:`${S.subject} · ${S.section}`;
  if(!confirm(`${label}의 학습 기록만 초기화할까요?`))return;

  S.reviewFilter='all';S.qIndex=0;S.cIndex=0;save();renderAll();toast(`${label} 기록을 초기화했어요`);
}

function keyNorm(v){return String(v??'').trim().toLowerCase().replace(/[\s_\-./\\()\[\]]/g,'')}
function normalizeRow(row){const out={};Object.entries(row||{}).forEach(([k,v])=>out[keyNorm(k)]=v);return out}
function pickN(o,names){for(const n of names){const v=o[keyNorm(n)];if(v!==undefined&&norm(v))return norm(v)}return''}

function parseRows(rows,sheetName=''){
  return rows.map((raw,i)=>{
    const r=normalizeRow(raw);let opts=[];
    for(let n=1;n<=5;n++){
      const v=pickN(r,[`보기${n}`,`선택지${n}`,`답지${n}`,`option${n}`,`choice${n}`,String.fromCharCode(64+n)]);
      if(v)opts.push(v);
    }
    if(!opts.length){
      const rawOptions=pickN(r,['보기','선택지','답지','options','choices']);
      if(rawOptions)opts=rawOptions.split(/\s*\|\s*|\r?\n|\s*;\s*/).map(x=>x.trim()).filter(Boolean);
    }
    const inferredSubject=SUBJECTS.find(s=>keyNorm(sheetName).includes(keyNorm(s)))||'';
    return{
      subject:pickN(r,['과목','subject','분야'])||inferredSubject,
      kind:pickN(r,['유형','학습유형','문제유형','kind','type']),
      subtitle:pickN(r,['소제목','세트','학습세트','subtitle','section','day']),
      unit:pickN(r,['단원','unit','chapter']),
      question:pickN(r,['문제','문항','질문','question']),
      answer:pickN(r,['정답','답','answer']),options:opts,
      explanation:pickN(r,['해설','풀이','설명','explanation']),
      front:pickN(r,['앞면','front','단어','개념명','word']),
      back:pickN(r,['뒷면','back','뜻','의미','정의','meaning']),
      partOfSpeech:pickN(r,['품사','partofspeech','pos']),
      pronunciation:pickN(r,['발음','발음기호','pronunciation','pron']),
      synonyms:pickN(r,['유의어','동의어','synonyms','synonym']),
      antonyms:pickN(r,['반의어','antonyms','antonym']),
      derivatives:pickN(r,['파생어','derivatives','derivative']),
      phrases:pickN(r,['숙어표현','숙어/표현','숙어','표현','phrases','phrase']),
      keyExpressions:pickN(r,['핵심표현','핵심 표현','중요표현','keyexpression','keyexpressions','keyphrase']),
      etymology:pickN(r,['어원','etymology','origin']),
      example:pickN(r,['예문','example','sentence']),
      exampleTranslation:pickN(r,['예문해석','예문 해석','해석','번역','exampletranslation','translation']),
      source:pickN(r,['출처','기출','출제','source']),
      memo:pickN(r,['메모','memo','note']),
      tags:pickN(r,['태그','tags','tag']),
      uid:'u_'+Date.now()+'_'+sheetName+'_'+i
    }
  }).filter(x=>x.subject&&(x.question||x.front||x.back));
}

function importFile(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'}),all=[];
      wb.SheetNames.forEach(name=>all.push(...parseRows(XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:''}),name)));
      if(!all.length)throw new Error('학습 행 없음');
      S.items=all;S.filename=file.name;S.subject=SUBJECTS.find(s=>all.some(x=>x.subject===s))||'회계';
      S.section='전체';S.wrong=new Set();S.memory={};S.attempts={};S.qIndex=0;S.cIndex=0;
      save();renderAll();toast(`${all.length}개 항목을 불러왔어요`);
    }catch(err){console.error(err);toast('엑셀 형식을 확인해주세요')}
  };
  reader.readAsArrayBuffer(file);
}

$('selectorToggle').onclick=()=>toggleSelectors();
$('uploadBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{const f=e.target.files?.[0];if(f)importFile(f);e.target.value=''};

function downloadCurrentWorkbook(){
  try{
    const headers=[
      '과목','유형','소제목','단원','문제','정답',
      '보기1','보기2','보기3','보기4','보기5','해설',
      '앞면','뒷면','품사','발음','유의어','반의어','파생어',
      '숙어/표현','핵심표현','어원','예문','예문해석','출처','메모','태그'
    ];

    const rows=S.items.map(it=>{
      const opts=Array.isArray(it.options)?it.options:[];
      return[
        it.subject||'',
        it.kind||'',
        it.subtitle||'',
        it.unit||'',
        it.question||'',
        it.answer||'',
        opts[0]||'',
        opts[1]||'',
        opts[2]||'',
        opts[3]||'',
        opts[4]||'',
        it.explanation||'',
        it.front||'',
        it.back||'',
        it.partOfSpeech||'',
        it.pronunciation||'',
        it.synonyms||'',
        it.antonyms||'',
        it.derivatives||'',
        it.phrases||'',
        it.keyExpressions||'',
        it.etymology||'',
        it.example||'',
        it.exampleTranslation||'',
        it.source||'',
        it.memo||'',
        it.tags||''
      ];
    });

    // 현재 데이터 아래에 바로 추가 입력할 수 있도록 빈 행 30개를 함께 넣음.
    const blankRows=Array.from({length:30},()=>Array(headers.length).fill(''));
    const ws=XLSX.utils.aoa_to_sheet([headers,...rows,...blankRows]);

    ws['!cols']=[
      {wch:10},{wch:10},{wch:18},{wch:16},{wch:38},{wch:10},
      {wch:28},{wch:28},{wch:28},{wch:28},{wch:28},{wch:36},
      {wch:18},{wch:28},{wch:10},{wch:16},{wch:28},{wch:28},{wch:38},
      {wch:38},{wch:38},{wch:24},{wch:42},{wch:42},{wch:20},{wch:26},{wch:18}
    ];
    ws['!autofilter']={ref:`A1:AA${Math.max(2,rows.length+1)}`};

    const guideRows=[
      ['최신 학습앱 작성가이드',''],
      ['사용법','다운로드한 파일에는 현재 앱에 들어있는 데이터가 그대로 포함됩니다. 마지막 데이터 아래 빈 행에 새 내용을 추가한 뒤 앱에서 다시 업로드하세요.'],
      ['과목','회계 / 세법 / 국어 / 영어'],
      ['유형','OX / 객관식 / 문법 / 단어 / 개념'],
      ['객관식','보기1~보기5까지 사용 가능. 정답은 A~E 또는 1~5 모두 인식합니다.'],
      ['품사 입력','n / v / a / ad / p 로 짧게 입력'],
      ['품사 표시','앞면: 명/동/형/부/전 · 뒷면: 명사/동사/형용사/부사/전치사'],
      ['파생어','예: protection n 보호 | protective a 보호하는 | protector n 보호자'],
      ['파생어 여러 뜻','같은 단어의 여러 뜻은 쉼표 사용: progression n 진보, 진행'],
      ['여러 파생어 구분','| 또는 줄바꿈 또는 ; 로 구분'],
      ['핵심표현','여러 개면 | 로 구분'],
      ['기출예문','예문 열에 영어 문장, 예문해석 열에 한국어 해석 입력']
    ];
    const guide=XLSX.utils.aoa_to_sheet(guideRows);
    guide['!cols']=[{wch:18},{wch:80}];

    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'학습데이터');
    XLSX.utils.book_append_sheet(wb,guide,'작성가이드');

    const baseName=(S.filename||'학습앱_데이터').replace(/\.(xlsx|xls|csv)$/i,'');
    XLSX.writeFile(wb,`${baseName}_이어쓰기.xlsx`);
    toast(`현재 데이터 ${rows.length}개를 포함해 저장했어요`);
  }catch(err){
    console.error(err);
    toast('엑셀 파일 저장 중 오류가 났어요');
  }
}
$('templateBtn').onclick=downloadCurrentWorkbook;

$$('[data-launch]').forEach(b=>b.onclick=()=>launch(b.dataset.launch));
$$('.navBtn').forEach(b=>b.onclick=()=>setScreen(b.dataset.screen));
{
  const card=$('flipCard');
  let px=0,py=0,moved=false;
  card.addEventListener('pointerdown',e=>{
    px=e.clientX;py=e.clientY;moved=false;
  });
  card.addEventListener('pointermove',e=>{
    if(Math.abs(e.clientX-px)>8||Math.abs(e.clientY-py)>8)moved=true;
  });
  card.addEventListener('pointerup',e=>{
    if(moved)return;
    card.classList.toggle('flipped');
    if(card.classList.contains('flipped')){
      const back=card.querySelector('.face.back');
      if(back)back.scrollTop=0;
    }
  });
}
$$('[data-memory]').forEach(b=>b.onclick=e=>{e.stopPropagation();setMemory(b.dataset.memory)});
$('prevCardBtn').onclick=()=>{if(S.cIndex>0){S.cIndex--;renderCard()}};
$('nextCardBtn').onclick=()=>{if(S.cIndex<S.cardPool.length-1){S.cIndex++;renderCard()}};
$('prevQuizBtn').onclick=()=>{if(S.qIndex>0){S.qIndex--;renderQuiz()}};
$('nextQuizBtn').onclick=()=>{if(S.qIndex<S.quizPool.length-1){S.qIndex++;renderQuiz()}};

document.addEventListener('click',e=>{
  if(S.selectorsOpen&&!$('selectorPanel').contains(e.target)&&e.target!==$('selectorToggle'))toggleSelectors(false);
});

load();
if(!S.items.length)S.items=SAMPLE;
renderAll();

if('serviceWorker' in navigator){
  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'});
      await reg.update();
    }catch(e){}
  });
}
